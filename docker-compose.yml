version: '3.8'

services:
  # SQL Server for local development
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: helping-hand-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "DevPassword123!"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P DevPassword123! -Q 'SELECT 1' -C -l 1 -r 1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - helping-hand-network

  # ASP.NET 8 Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helping-hand-app
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=HelpingHandDb;User Id=sa;Password=DevPassword123!;Encrypt=False;TrustServerCertificate=True;Connection Timeout=30;"
    ports:
      - "5000:5000"
    networks:
      - helping-hand-network
    # Remove this in production - allows interactive debugging
    stdin_open: true
    tty: true

volumes:
  sqlserver_data:

networks:
  helping-hand-network:
    driver: bridge
